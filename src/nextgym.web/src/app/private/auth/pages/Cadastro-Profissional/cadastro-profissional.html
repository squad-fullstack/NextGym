<section class="cadastro-section">
  <h1 class="sr-only">Faça seu cadastro na NextGym</h1>

  <form [formGroup]="cadastroForm" (ngSubmit)="onSubmit()" class="cadastro-form">
    
    <!-- Campo Nome -->
    <div class="input-group">
      <label for="nome">Nome</label>
      <input 
        type="text" 
        id="nome" 
        formControlName="nome" 
        placeholder="Digite seu nome completo"
        [attr.aria-invalid]="nomeControl?.invalid && nomeControl?.touched ? true : null"
        aria-describedby="nome-error"
      >
      <span *ngIf="nomeControl?.invalid && nomeControl?.touched" id="nome-error" class="error-message">
        <span *ngIf="nomeControl?.errors?.['required']">O nome é obrigatório.</span>
      </span>
    </div>

    <!-- Campo RA -->
    <div class="input-group">
      <label for="ra">RA</label>
      <input 
        type="text" 
        id="ra" 
        formControlName="ra" 
        placeholder="Digite seu RA"
        [attr.aria-invalid]="raControl?.invalid && raControl?.touched ? true : null"
        aria-describedby="ra-error"
      >
      <span *ngIf="raControl?.invalid && raControl?.touched" id="ra-error" class="error-message">
        <span *ngIf="raControl?.errors?.['required']">O RA é obrigatório.</span>
      </span>
    </div>

    <!-- Campo E-mail -->
    <div class="input-group">
      <label for="email">E-mail</label>
      <input 
        type="email" 
        id="email" 
        formControlName="email" 
        placeholder="seu@email.com"
        [attr.aria-invalid]="emailControl?.invalid && emailControl?.touched ? true : null"
        aria-describedby="email-error"
      >
      <span *ngIf="emailControl?.invalid && emailControl?.touched" id="email-error" class="error-message">
        <span *ngIf="emailControl?.errors?.['required']">O e-mail é obrigatório.</span>
        <span *ngIf="emailControl?.errors?.['email']">Digite um e-mail válido.</span>
      </span>
    </div>

    <!-- Campo Senha -->
    <div class="input-group">
      <label for="password">Senha</label>
      <input 
        type="password" 
        id="password" 
        formControlName="password" 
        placeholder="********"
        [attr.aria-invalid]="passwordControl?.invalid && passwordControl?.touched ? true : null"
        aria-describedby="password-error"
      >
      <span *ngIf="passwordControl?.invalid && passwordControl?.touched" id="password-error" class="error-message">
        <span *ngIf="passwordControl?.errors?.['required']">A senha é obrigatória.</span>
        <span *ngIf="passwordControl?.errors?.['minlength']">A senha deve ter pelo menos 6 caracteres.</span>
      </span>
    </div>

    <button type="submit" class="btn-primary">Cadastrar</button>

    <div class="register-container">
      <p>Já possui uma conta? 
        <a [routerLink]="['/auth/login']" class="register-link">Faça login aqui</a>
      </p>
    </div>

  </form>
</section>
